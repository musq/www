baseURL = 'https://tug.ro/'
languageCode = 'en-us'
title = 'the sound of musq'
theme = "hugo-theme-monochrome"
enableEmoji = true
enableGitInfo = true

[taxonomies]
tag = "tags"

[outputs]
home = ["HTML", "RSS", "JSON"]

[frontmatter]
# Use date mentioned in the file name
# https://gohugo.io/configuration/front-matter/#filename
date = [':filename', ':default']

# ----------------------------------------------------------------------
# Params
# ----------------------------------------------------------------------

[params]
author = "Ashish Ranjan"
hide_navbar_on_scroll = false

# Toggle features
enable_zooming_js = true
enable_header_anchor = true
# Enable Table of contents in relevant posts' front matter explicitly via toc = true
enable_toc = false
enable_site_search = true
enable_math = false

# SEO
enable_open_graph = true
enable_twitter_cards = true

# Collapsible Menu
enable_collapsible_toc = false
enable_collapsible_changelogs = true
toc_position = "right"               # "top" | "right"

# Syntax Highlighting
[params.syntax_highlight]
lib = "prism.js" # "builtin" | "prism.js" (default: "builtin")
[params.syntax_highlight.prism]
enable_code_copy = true
enable_line_no = true

[markup.highlight]
# https://gohugo.io/content-management/syntax-highlighting
anchorLineNos = false
codeFences = false
lineNos = true
lineNumbersInTable = true
style = "monokai"
tabWidth = 4

# ----------------------------------------------------------------------
# Menu Bar
# ----------------------------------------------------------------------

[[menu.navbar]]
name = "About"
url = "/about"
identifier = "about"
weight = 1

[[menu.navbar]]
name = "Blog"
url = "/blog"
identifier = "blog"
weight = 2
